name: Daily 9AM UAE Email (Yesterday)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas boto3

      - name: Debug SMTP host (safe)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: |
          python - <<'PY'
          import os, re
          host = (os.getenv("SMTP_HOST") or "")
          print("SMTP_HOST set:", bool(host))
          print("RAW repr:", repr(host))
          host2 = host.strip()
          print("STRIPPED repr:", repr(host2))
          print("Looks like IP:", bool(re.fullmatch(r"\d+\.\d+\.\d+\.\d+", host2)))
          PY

      - name: Send yesterday email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_BASE_PREFIX: ${{ secrets.S3_BASE_PREFIX }}
          CENTER_KEY: ${{ secrets.CENTER_KEY }}
        run: |
          python scripts/send_yesterday_email.py
